name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend -> target

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-features

  # Runs on the self-hosted runner living on the production VM itself, so the
  # binary is built for the exact machine it runs on and "deploying" is just
  # restarting a local systemd --user service. This job only ever runs for
  # pushes to main (never for pull_request events), so untrusted PRs never
  # execute code on the production host.
  deploy:
    name: Build & Deploy
    runs-on: [self-hosted, hl-alerts-vm]
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    defaults:
      run:
        working-directory: backend
    steps:
      # clean: false keeps backend/target/ across runs so this incrementally
      # rebuilds instead of recompiling the whole dependency tree from
      # scratch every push (this VM has a single shared vCPU).
      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Build release binary
        run: cargo build --release

      - name: Install binary
        run: |
          set -euo pipefail
          APP_DIR="$HOME/apps/hyperliquid-alerts"
          mkdir -p "$APP_DIR"
          install -m 755 target/release/backend "$APP_DIR/hyperliquid-alerts.new"
          mv "$APP_DIR/hyperliquid-alerts.new" "$APP_DIR/hyperliquid-alerts"

      - name: Restart service
        run: |
          set -euo pipefail
          systemctl --user restart hyperliquid-alerts.service
          sleep 3
          systemctl --user is-active hyperliquid-alerts.service
          systemctl --user status hyperliquid-alerts.service --no-pager -l | tail -n 20
